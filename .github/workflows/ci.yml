name: CI - Testes TaskAnalyzer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  testes:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar test harness
        run: pytest tests/test_harness.py -v

      - name: Relatorio de cobertura
        run: pytest tests/test_harness.py --cov=src --cov-report=term-missing
